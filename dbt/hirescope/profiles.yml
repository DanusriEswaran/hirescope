hirescope:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'hirescope') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'hirescope_pw') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'hirescope') }}"
      schema: analytics
      threads: 4
